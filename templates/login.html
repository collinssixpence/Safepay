<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SafePay | Login</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; padding: 40px; }
        .box { max-width: 350px; margin: auto; background: #1e293b; padding: 24px; border-radius: 8px; border: 1px solid #334155; }
        h2 { color: #38bdf8; margin-top: 0; }
        input { width: 100%; padding: 10px; margin: 8px 0; background: #0f172a; border: 1px solid #334155; color: #fff; box-sizing: border-box; border-radius: 4px; }
        button { width: 100%; padding: 12px; background: #38bdf8; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; color: #0f172a; margin-top: 10px; }
        a { color: #38bdf8; text-decoration: none; font-size: 9pt; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Merchant Login</h2>
        <form method="POST">
            <input type="email" name="email" placeholder="Email Address" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Sign In</button>
        </form>
        <p><a href="/register">Don't have an account? Register here</a></p>
    </div>
</body>
</html>
